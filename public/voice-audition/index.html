<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>声の聴き比べ · Chordscape</title>
    <style>
      :root {
        font-family: system-ui, sans-serif;
        color: #302d29;
        background: #f6f3ed;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      main {
        max-width: 760px;
        margin: auto;
        padding: 24px 16px 210px;
      }
      h1 {
        font-size: 1.5rem;
        margin: 12px 0;
      }
      h2 {
        font-size: 1.05rem;
        margin: 0;
      }
      p {
        line-height: 1.7;
      }
      .intro,
      .credit {
        font-size: 0.85rem;
        color: #5a554e;
      }
      .voice {
        margin: 12px 0;
        padding: 16px;
        border: 1px solid #d8d1c5;
        border-radius: 12px;
        background: #fffdf8;
      }
      .voice header {
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
      }
      button {
        border: 1px solid #b9ad9c;
        border-radius: 8px;
        background: #fff;
        color: inherit;
        padding: 10px 12px;
        font: inherit;
        cursor: pointer;
        min-height: 44px;
      }
      button:hover {
        background: #eee8dd;
      }
      button:focus-visible,
      a:focus-visible,
      audio:focus-visible {
        outline: 3px solid #9b502e;
        outline-offset: 3px;
      }
      button[aria-pressed='true'] {
        background: #6b452f;
        color: white;
      }
      .clips {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-top: 14px;
      }
      .credit {
        margin: 12px 0 0;
      }
      a {
        color: #704025;
      }
      footer {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 12px 16px max(12px, env(safe-area-inset-bottom));
        background: #fffdf8;
        border-top: 1px solid #d8d1c5;
      }
      .player {
        max-width: 728px;
        margin: auto;
      }
      #now {
        display: block;
        min-height: 1.5em;
        font-size: 0.9rem;
        margin-bottom: 8px;
      }
      audio {
        display: block;
        width: 100%;
        height: 40px;
      }
      .actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 8px;
      }
      .actions a {
        font-size: 0.85rem;
      }
      @media (max-width: 400px) {
        .voice {
          padding: 12px;
        }
        h2 {
          font-size: 0.95rem;
        }
        button {
          padding: 8px;
          font-size: 0.85rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>声の聴き比べ</h1>
      <p class="intro">
        同じ3つのコード名で比較できます。「3つ続けて」またはコード名を押すと再生します。
      </p>
      <p class="intro">
        Cmaj7：シーメジャーセブンス<br />F♯m7：エフシャープマイナーセブンス<br />Bm7♭5：ビーマイナーセブンス、フラットファイブ
      </p>
      <div id="voices"></div>
      <p class="intro">
        音量差を抑えてあります。新しい音声はコード名を一続きで生成し、以前の音声は単語をつないでいます。声質と読み方の両方が変わる比較です。アクセントの個別調整はまだ行っていません。
      </p>
      <p class="intro">
        このページは音声選定のための試聴用です。アプリの読み上げにはNemoの女声1を採用しています。
      </p>
      <p class="intro"><a href="README.md">音声の出典・生成条件</a></p>
    </main>
    <footer>
      <div class="player">
        <strong id="now" role="status">聴きたい声を選んでください</strong>
        <audio id="audio" controls preload="none" aria-label="試聴音声"></audio>
        <div class="actions">
          <button id="stop" type="button">停止</button
          ><a id="download" hidden download>選択中の音声を保存</a>
        </div>
      </div>
    </footer>
    <script>
      const voices = [
        {
          id: 'nemo-female1',
          name: 'Nemo · 女声1',
          credit: 'VOICEVOX Nemo',
          license: 'LICENSE-Nemo.txt',
        },
        {
          id: 'nemo-male1',
          name: 'Nemo · 男声1',
          credit: 'VOICEVOX Nemo',
          license: 'LICENSE-Nemo.txt',
        },
        {
          id: 'aivis-kohaku',
          name: 'AivisSpeech · コハク',
          credit: 'AivisSpeech / コハク（ノーマル）· ACML 1.0',
          license: 'LICENSE-Aivis-Kohaku.txt',
        },
        {
          id: 'aivis-mao',
          name: 'AivisSpeech · まお',
          credit: 'AivisSpeech / まお（ノーマル）· ACML 1.0',
          license: 'LICENSE-Aivis-Mao.txt',
        },
        {
          id: 'current-mei',
          name: '以前の声 · Mei',
          credit:
            'Open JTalk / HTS Voice Mei · Nagoya Institute of Technology (2009–2013) · CC BY 3.0',
          license: 'CC-BY-3.0.txt',
        },
      ];
      const clips = [
        ['cmaj7', 'Cmaj7'],
        ['fsharp-m7', 'F♯m7'],
        ['bm7-flat5', 'Bm7♭5'],
      ];
      const labels = {
        all: '3つ続けて',
        stopped: '停止しました',
        error: '音声を再生できませんでした。もう一度選んでください。',
      };
      const player = document.getElementById('audio');
      const now = document.getElementById('now');
      const download = document.getElementById('download');
      let request = 0;
      function resetButtons() {
        document
          .querySelectorAll('[aria-pressed]')
          .forEach((button) => button.setAttribute('aria-pressed', 'false'));
      }
      function playButton(voice, key, label) {
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = label;
        button.setAttribute('aria-label', `${voice.name}：${label}を再生`);
        button.setAttribute('aria-pressed', 'false');
        button.addEventListener('click', async () => {
          const current = ++request;
          player.pause();
          resetButtons();
          player.src = `${voice.id}-${key}.wav`;
          now.textContent = `${voice.name} / ${key === 'all' ? 'Cmaj7 → F♯m7 → Bm7♭5' : label}`;
          player.setAttribute('aria-label', now.textContent);
          download.href = player.src;
          download.hidden = false;
          button.setAttribute('aria-pressed', 'true');
          try {
            await player.play();
          } catch {
            if (current === request) {
              now.textContent = labels.error;
              resetButtons();
            }
          }
        });
        return button;
      }
      for (const voice of voices) {
        const section = document.createElement('section');
        section.className = 'voice';
        const header = document.createElement('header');
        const heading = document.createElement('h2');
        heading.id = voice.id;
        heading.textContent = voice.name;
        section.setAttribute('aria-labelledby', heading.id);
        header.append(heading, playButton(voice, 'all', labels.all));
        const buttons = document.createElement('div');
        buttons.className = 'clips';
        for (const [key, label] of clips)
          buttons.append(playButton(voice, key, label));
        const credit = document.createElement('p');
        credit.className = 'credit';
        const link = document.createElement('a');
        link.href = voice.license;
        link.textContent = voice.credit;
        credit.append(link);
        section.append(header, buttons, credit);
        document.getElementById('voices').append(section);
      }
      function stop() {
        request++;
        player.pause();
        if (player.readyState > 0) player.currentTime = 0;
        resetButtons();
        now.textContent = labels.stopped;
      }
      document.getElementById('stop').addEventListener('click', stop);
      player.addEventListener('ended', resetButtons);
      window.addEventListener('pagehide', stop);
    </script>
  </body>
</html>
