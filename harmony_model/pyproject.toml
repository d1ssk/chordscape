[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chordscape-harmony-model"
version = "0.1.0"
description = "Independent factorized harmony representation for Chordscape"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
train = ["numpy==1.26.4", "torch==2.8.0"]

[tool.setuptools]
packages = ["harmony_model"]

[tool.setuptools.package-data]
harmony_model = ["model_versions.json"]
